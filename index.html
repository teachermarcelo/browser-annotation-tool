<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Annotation Tool</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand">✦ Browser Annotation Tool</div><div class="actions"><button id="capture">📸 Capturar tela</button><button id="openImage">🖼️ Abrir imagem</button><button id="undo">↶</button><button id="redo">↷</button><button id="clear">Limpar</button><button id="download" class="primary">⬇ Baixar PNG</button></div></header><main><section class="toolbar"><button class="tool active" data-tool="pen">✎ Caneta</button><button class="tool" data-tool="highlighter">▰ Marca-texto</button><button class="tool" data-tool="arrow">➜ Seta</button><button class="tool" data-tool="rect">□ Retângulo</button><button class="tool" data-tool="circle">○ Círculo</button><button class="tool" data-tool="text">T Texto</button><label>Cor <input id="color" type="color" value="#ff2d55"></label><label>Tamanho <input id="size" type="range" min="1" max="30" value="5"></label></section><section id="stage"><div id="empty"><div class="big">📸</div><h1>Capture uma tela ou abra uma imagem</h1><p>Depois desenhe, destaque, escreva e baixe o resultado.</p><button id="capture2" class="primary">Capturar tela</button></div><canvas id="canvas"></canvas></section></main><input id="fileInput" type="file" accept="image/*" hidden><script src="app.js"></script></body></html>
